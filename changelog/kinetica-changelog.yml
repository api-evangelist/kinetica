  highlights:
  - On-disk column compression
  - SQL-orchestrated commands for full and incremental backups
  - PGQ/GQL graph query language support
  - Native Kafka integration for high-availability data replication
- version: 7.2.2
  date: '2024-09-21'
  date_kind: build
  breaking: false
  highlights:
  - HNSW index support for vector similarity search
  - Parallelized group-by output handling
  - Dictionary encoding on unrestricted-length string columns
  - Single sign-on (SSO) across the UI platforms
- version: 7.2.1
  date: '2024-08-27'
  date_kind: build
  breaking: false
  highlights:
  - Remote model support for embedding generation
  - UDF for automated RAG across SQL-GPT contexts
  - Recursive EXPLAIN hint for materialized views
  - CREATE permissions at system, directory and schema level
  - Query optimization hints (MATERIALIZE, GROUPBY_PK, NO_VIRTUAL_UNION)
  - Job user-data tagging via hints
- version: 7.2.0
  date: '2024-02-11'
  date_kind: publish
  breaking: true
  breaking_detail: store-only column type removed; affected VARCHAR columns are automatically
    converted
  highlights:
  - Unlimited string support across scalar/aggregate functions and SQL operations
  - ARRAY type with scalar and aggregate functions
  - JSON type with a full function suite
  - VECTOR type with distance and norm calculations
  - Storage optimization reducing on-disk size by ~50%

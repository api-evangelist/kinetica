apis:
- name: Kinetica Database REST API
  description: POST-only JSON REST API exposed by every Kinetica deployment on port
    9191. Endpoints cover SQL execution (/execute/sql), record ingest and egress (/insert/records/json,
    /get/records/json), schema and metadata introspection (/show/table, /show/graph,
    /show/system/properties), filtering (/filter/byarea, /filter/byradius), aggregation
    (/aggregate/groupby, /aggregate/statistics, /aggregate/histogram, /aggregate/kmeans),
    graph creation and solving (/create/graph, /match/graph) and cluster administration
    (/admin/rebalance, /admin/show/cluster/operations). Authentication is HTTP Basic
    or an OAuth 2.0 bearer token. The base URL is deployment-specific — clusters are
    self-hosted or provisioned through Kinetica Cloud — so there is no single public
    production host.
  humanURL: https://docs.kinetica.com/7.2/api/rest/
  baseURL: https://cloud.kinetica.com/
  x-base-url-note: Deployment-specific. The documented form is http://<db.host>:9191
    for a self-managed cluster; cloud.kinetica.com is the Kinetica Cloud provisioning
    console that issues a per-cluster host.

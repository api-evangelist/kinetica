  - type: OAuthScopes
    url: scopes/kinetica-scopes.yml
- name: Kinetica Docs MCP Server
  description: Read-only Model Context Protocol server over the published Kinetica
    documentation site, advertised from https://docs.kinetica.com/.well-known/mcp.json
    with authentication none. Exposes search_kinetica_docs (full-text search across
    the docs knowledge base), query_docs_filesystem_kinetica_docs (read-only shell-like
    queries against a virtualized in-memory filesystem of the docs tree) and submit_feedback
    (report a documentation defect). Scoped to public site content; the server performs
    no database actions.
  humanURL: https://docs.kinetica.com/
  baseURL: https://kinetica.main-kill-isr.mintlify.me/mcp

aid: kinetica
name: Kinetica
description: Kinetica is a GPU-accelerated, real-time analytical database that unifies
  relational (SQL), vector, graph, geospatial, time-series and OLAP workloads in a
  single query engine, aimed at applications needing millisecond-latency analytics
  over continuously streaming data. Grown out of a GPU-accelerated geospatial and
  temporal engine built for U.S. Army Intelligence (INSCOM) in 2009, it is deployed
  today as the retrieval and reasoning layer behind AI agents and LLM-powered systems.
  The database is consumed through a POST-only JSON REST API (/execute/sql, /show/table,
  /insert/records/json, /filter/*, /aggregate/*, /match/graph and friends) served
  from each deployment on port 9191, plus first-party client libraries for Python,
  Java, C++, C#, JavaScript/Node.js and Go, JDBC/ODBC drivers, and the KiSQL command-line
  client. For agents, Kinetica publishes an A2A agent card and an installable Agent
  Skills package on its documentation host, and ships Toolbelt — an OAuth-protected
  hosted MCP server exposing toolbelt_* tools for SQL, vector search, graph traversal,
  schema introspection and ingest-job inspection.

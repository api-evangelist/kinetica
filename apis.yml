- name: Kinetica Toolbelt MCP Server
  description: Hosted Model Context Protocol server that gives any MCP-speaking agent
    a single endpoint onto a Kinetica database. Exposes toolbelt_* tools for SQL execution,
    vector search, knowledge-graph traversal, schema introspection and ingest-job
    inspection, with namespace isolation between datasets. Protected by OAuth 2.0
    (RFC 9728 protected-resource metadata, authorization server at app.toolbelt.ai,
    scope mcp:tools, PKCE S256, dynamic client registration). Installable in one command
    with npx @toolbeltai/cli, or self-hosted via the Helm chart.
  humanURL: https://www.kinetica.com/agents
  baseURL: https://mcp.toolbelt.ai/mcp
